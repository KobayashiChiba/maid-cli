# ─────────────────────────────────────────────────────────────
#  Maid CLI · Gradle 用户参数（所有版本号的唯一来源）
#  改版本号只改这一个文件，构建时自动展开到 neoforge.mods.toml
# ─────────────────────────────────────────────────────────────

# ── Gradle 自身行为 ──
# ModDevGradle 首次要跑 NeoForm 重映射（下 MC + 打补丁 + 反混淆），很吃内存
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ── 环境版本 ──
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# NeoForge 版本：以 https://projects.neoforged.net/neoforged/neoforge 为准
neo_version=21.1.219
neo_version_range=[21.1.219,)
# FML loader 版本范围只看主版本号
loader_version_range=[4,)

# ── 编译期依赖：车万女仆（Touhou Little Maid）──
# 走 Modrinth maven，无需手动下载。离线时可把 jar 放进 libs/ 兜底。
# 版本列表：https://modrinth.com/mod/touhou-little-maid/versions?g=1.21.1&l=neoforge
tlm_version=1.5.3-neoforge+mc1.21.1
tlm_version_range=[1.5.3,)

# ── Mod 元数据 ──
mod_id=maid_cli
mod_name=Maid CLI
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.xiaofeng.maidcli
mod_authors=KobayashiChiba
mod_description=HTTP control layer for Touhou Little Maid: read a maid's senses and drive her from outside the game (world ops, container / station sessions, macros). Listens on 127.0.0.1 only.
mod_issue_tracker=https://github.com/KobayashiChiba/maid-cli/issues
