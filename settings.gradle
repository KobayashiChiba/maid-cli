pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        // ModDevGradle 插件本体在 neoforged maven 上
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // 自动下载缺失的 JDK 工具链（用户机器没装 JDK 21 时也能构建）
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'maid-cli'
